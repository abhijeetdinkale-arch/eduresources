name: Build Multiplatform Apps (Windows, Mac, Android)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-desktop:
    name: Build Windows (.exe) and Mac (.dmg)
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: viewer-platform/package-lock.json

      - name: Install dependencies & Build
        run: |
          cd viewer-platform
          npm install
          cd client && npm install && npm run build
          cd ..

      - name: Build Mac App
        if: runner.os == 'macOS'
        run: |
          cd viewer-platform
          npx electron-builder --mac

      - name: Build Windows App
        if: runner.os == 'Windows'
        run: |
          cd viewer-platform
          npx electron-builder --win

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-build-${{ runner.os }}
          path: viewer-platform/release/*.(dmg|zip|exe|msi)

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Sync Capacitor Android
        run: |
          cd viewer-platform
          npm install
          cd client && npm install && npm run build
          cd ..
          npx cap sync android

      - name: Build Android APK
        run: |
          cd viewer-platform/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: viewer-platform/android/app/build/outputs/apk/debug/*.apk
